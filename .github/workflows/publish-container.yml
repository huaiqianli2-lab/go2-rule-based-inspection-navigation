name: Publish offline demo container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and verify
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker build --pull --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:$VERSION" .
          docker run --rm --network none "$IMAGE:$VERSION" python -m unittest discover -s tests -v
          docker run --rm --network none "$IMAGE:$VERSION" > demo.json
          python3 -c 'import json; r=json.load(open("demo.json")); assert r["transverse_crossings"] == 1 and r["repeated_length"] == 2.0 and r["visit_order_audit"]["best_length_m"] == 23.0'
      - name: Push verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
