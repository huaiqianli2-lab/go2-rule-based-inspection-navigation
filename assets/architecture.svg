<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img" aria-label="Go2 Patrol hardware and software architecture"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#63758a"/></marker></defs><rect width="1000" height="750" rx="18" fill="#fff"/><g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="30" y="45" font-size="27" font-weight="700" fill="#142d44">Go2 Patrol · 软硬件系统架构</text><text x="30" y="77" font-size="15" fill="#526b7c">感知采集 → 电脑端建图与规划 → 机器人执行 → 巡检成果</text>
