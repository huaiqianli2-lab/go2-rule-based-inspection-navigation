<rect x="25" y="305" width="950" height="155" rx="14" fill="#e9f8f5"/><text x="42" y="332" font-size="17" font-weight="600" fill="#087f72">电脑端管控软件</text>
<rect x="25" y="505" width="950" height="155" rx="14" fill="#f2eefc"/><text x="42" y="532" font-size="17" font-weight="600" fill="#7153a3">机器人执行与成果回传</text>
<rect x="50" y="155" width="280" height="80" rx="10" fill="#fff" stroke="#2861a1"/><text x="190" y="187" text-anchor="middle" font-size="18" fill="#183449">XT16 激光雷达 + IMU</text><text x="190" y="214" text-anchor="middle" font-size="13" fill="#526b7c">点云 / 惯性数据</text>
<rect x="360" y="155" width="280" height="80" rx="10" fill="#fff" stroke="#2861a1"/><text x="500" y="187" text-anchor="middle" font-size="18" fill="#183449">Go2 前置相机</text><text x="500" y="214" text-anchor="middle" font-size="13" fill="#526b7c">巡检图像采集</text>
<rect x="670" y="155" width="280" height="80" rx="10" fill="#fff" stroke="#2861a1"/><text x="810" y="187" text-anchor="middle" font-size="18" fill="#183449">Go2 EDU 与机载计算单元</text><text x="810" y="214" text-anchor="middle" font-size="13" fill="#526b7c">平台服务 / SDK / 运动接口</text>
<rect x="50" y="350" width="280" height="80" rx="10" fill="#fff" stroke="#087f72"/><text x="190" y="382" text-anchor="middle" font-size="18" fill="#183449">采集与三维建图</text><text x="190" y="409" text-anchor="middle" font-size="13" fill="#526b7c">录制 / 雷达驱动 / LIO-SAM</text>
<rect x="360" y="350" width="280" height="80" rx="10" fill="#fff" stroke="#087f72"/><text x="500" y="382" text-anchor="middle" font-size="18" fill="#183449">语义目标与观测点</text><text x="500" y="409" text-anchor="middle" font-size="13" fill="#526b7c">人工标注 / 可达性 / 视线</text>
<rect x="670" y="350" width="280" height="80" rx="10" fill="#fff" stroke="#087f72"/><text x="810" y="382" text-anchor="middle" font-size="18" fill="#183449">规则规划与任务生成</text><text x="810" y="409" text-anchor="middle" font-size="13" fill="#526b7c">室内外引擎 / 几何与高程检查</text>
<rect x="50" y="550" width="280" height="80" rx="10" fill="#fff" stroke="#7153a3"/><text x="190" y="582" text-anchor="middle" font-size="18" fill="#183449">巡检结果与证据回传</text><text x="190" y="609" text-anchor="middle" font-size="13" fill="#526b7c">地图 / 轨迹 / 照片 / 日志</text>
<rect x="360" y="550" width="280" height="80" rx="10" fill="#fff" stroke="#7153a3"/><text x="500" y="582" text-anchor="middle" font-size="18" fill="#183449">导航执行与停靠拍照</text><text x="500" y="609" text-anchor="middle" font-size="13" fill="#526b7c">定位 / 避障 / 人工接管</text>
