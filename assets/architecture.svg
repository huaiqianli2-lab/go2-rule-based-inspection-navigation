<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img" aria-label="Go2 Patrol hardware and software architecture"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#63758a"/></marker></defs><rect width="1000" height="750" rx="18" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="45" font-size="27" font-weight="700" fill="#142d44">Go2 Patrol · System architecture</text><text x="30" y="77" font-size="15" fill="#526b7c">Sensing → Desktop mapping and planning → Robot execution → Inspection evidence</text>
<rect x="25" y="110" width="950" height="155" rx="14" fill="#ecf3fc"/><text x="42" y="137" font-size="17" font-weight="600" fill="#2861a1">Sensing and robot platform</text>
<rect x="25" y="305" width="950" height="155" rx="14" fill="#e9f8f5"/><text x="42" y="332" font-size="17" font-weight="600" fill="#087f72">Desktop inspection software</text>
<rect x="25" y="505" width="950" height="155" rx="14" fill="#f2eefc"/><text x="42" y="532" font-size="17" font-weight="600" fill="#7153a3">Execution and evidence retrieval</text>
<rect x="50" y="155" width="280" height="80" rx="10" fill="#fff" stroke="#2861a1"/><text x="190" y="187" text-anchor="middle" font-size="18" fill="#183449">XT16 LiDAR + IMU</text><text x="190" y="214" text-anchor="middle" font-size="13" fill="#526b7c">Point clouds / inertial readings</text>
<rect x="360" y="155" width="280" height="80" rx="10" fill="#fff" stroke="#2861a1"/><text x="500" y="187" text-anchor="middle" font-size="18" fill="#183449">Go2 front camera</text><text x="500" y="214" text-anchor="middle" font-size="13" fill="#526b7c">Inspection images</text>
<rect x="670" y="155" width="280" height="80" rx="10" fill="#fff" stroke="#2861a1"/><text x="810" y="187" text-anchor="middle" font-size="18" fill="#183449">Go2 EDU + onboard compute</text><text x="810" y="214" text-anchor="middle" font-size="13" fill="#526b7c">Platform services / SDK / motion</text>
<rect x="50" y="350" width="280" height="80" rx="10" fill="#fff" stroke="#087f72"/><text x="190" y="382" text-anchor="middle" font-size="18" fill="#183449">Acquisition and 3D mapping</text><text x="190" y="409" text-anchor="middle" font-size="13" fill="#526b7c">Recording / drivers / LIO-SAM</text>
<rect x="360" y="350" width="280" height="80" rx="10" fill="#fff" stroke="#087f72"/><text x="500" y="382" text-anchor="middle" font-size="18" fill="#183449">Targets and observation poses</text><text x="500" y="409" text-anchor="middle" font-size="13" fill="#526b7c">Annotation / reachability / line of sight</text>
<rect x="670" y="350" width="280" height="80" rx="10" fill="#fff" stroke="#087f72"/><text x="810" y="382" text-anchor="middle" font-size="18" fill="#183449">Rule-based mission planning</text><text x="810" y="409" text-anchor="middle" font-size="13" fill="#526b7c">Indoor/outdoor / geometry and elevation</text>
<rect x="50" y="550" width="280" height="80" rx="10" fill="#fff" stroke="#7153a3"/><text x="190" y="582" text-anchor="middle" font-size="18" fill="#183449">Evidence retrieval and reporting</text><text x="190" y="609" text-anchor="middle" font-size="13" fill="#526b7c">Map / trajectory / images / logs</text>
<rect x="360" y="550" width="280" height="80" rx="10" fill="#fff" stroke="#7153a3"/><text x="500" y="582" text-anchor="middle" font-size="18" fill="#183449">Navigation and image capture</text><text x="500" y="609" text-anchor="middle" font-size="13" fill="#526b7c">Localization / avoidance / supervision</text>
<rect x="670" y="550" width="280" height="80" rx="10" fill="#fff" stroke="#7153a3"/><text x="810" y="582" text-anchor="middle" font-size="18" fill="#183449">Mission sync and preflight</text><text x="810" y="609" text-anchor="middle" font-size="13" fill="#526b7c">Map / waypoints / mask / elevation</text>
