<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 366" role="img"><title>Go2 Patrol system architecture</title><desc>XT16 and IMU feed LIO-SAM. The map and operator targets feed dual map layers and Dijkstra planning. The mission runs on Go2 EDU and generates field evidence.</desc>
