<text x="144" y="277" font-size="17" fill="#475e78" font-weight="400">0.6296 m</text>
<path d="M235 274H584" fill="none" stroke="#b2c0cf" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="144" y="314" font-size="17" fill="#475e78" font-weight="400">0.16 m</text>
