<rect x="27" y="68" width="620" height="347" rx="10" fill="white" stroke="#d4deea"/>
<text x="51" y="100" font-size="23" fill="#142742" font-weight="700">Cell cross-section</text>
<text x="51" y="126" font-size="17" fill="#475e78" font-weight="400">Relative height above estimated local ground</text>
<rect x="264" y="151" width="320" height="102" rx="0" fill="#ffecd9" stroke="none"/>
