<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 443" role="img"><title>Navigation and line-of-sight masks</title><desc>Schematic side view of a 0.15 metre cell. Height bands above estimated ground count returns independently. At least two in-band returns flag a cell.</desc>
